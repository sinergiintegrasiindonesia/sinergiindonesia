<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sinergi Integrasi Indonesia">
  <defs>
    <linearGradient id="sii-ring" x1="10%" y1="90%" x2="90%" y2="5%">
      <stop offset="0%"  stop-color="#17a2a8"/>
      <stop offset="45%" stop-color="#3cb878"/>
      <stop offset="80%" stop-color="#8dcf3f"/>
      <stop offset="100%" stop-color="#d9e021"/>
    </linearGradient>
    <linearGradient id="sii-hook" x1="10%" y1="100%" x2="95%" y2="10%">
      <stop offset="0%"  stop-color="#1fa5b5"/>
      <stop offset="55%" stop-color="#4cbf6a"/>
      <stop offset="100%" stop-color="#c8dc2b"/>
    </linearGradient>
  </defs>

  <!-- Speech-bubble ring, open at the lower left -->
  <path d="M30.4 33.2 A27 27 0 1 1 30.4 47.6"
        fill="none" stroke="url(#sii-ring)" stroke-width="10.5" stroke-linecap="round"/>
  <!-- Bubble tail -->
  <path d="M33.5 50.5 L27 62"
        fill="none" stroke="url(#sii-ring)" stroke-width="10.5" stroke-linecap="round"/>

  <!-- Interlocking hook, echoing the link between people and technology -->
  <path d="M23 82 C13 74 13 60 23 54 C30 49.5 38.5 52 42.5 58.5"
        fill="none" stroke="url(#sii-hook)" stroke-width="10.5" stroke-linecap="round"/>
</svg>
